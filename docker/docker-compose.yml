# Uso (da raiz do repo): cp .env.example .env && docker compose --env-file .env -f docker/docker-compose.yml up -d --build --wait
name: oficina-execucao

services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs,sns
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Secret: ${JWT_SECRET:?defina JWT_SECRET (copie .env.example para .env)}
      Jwt__Issuer: oficina-auth
      Jwt__Audience: oficina-api
      Mensageria__Transporte: AmazonSqs
      Mensageria__PrefixoAmbiente: local
      Mensageria__ServiceUrl: http://localstack:4566
      DynamoDb__ServiceUrl: http://dynamodb:8000
      DynamoDb__NomeTabela: oficina-execucao-local
      DynamoDb__CriarTabelaSeAusente: "true"
      Execucao__CapacidadeMaximaPorUnidade: ${CAPACIDADE:-20}
      NEW_RELIC_APP_NAME: oficina-execucao
      # Credenciais ficticias: DynamoDB Local e LocalStack nao validam, mas o SDK AWS exige alguma.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    depends_on:
      dynamodb:
        condition: service_started
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
