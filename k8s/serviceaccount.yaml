apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-execucao
  namespace: ${NAMESPACE}
  labels:
    app: oficina-execucao
  annotations:
    # IRSA: o pod assume esta role (SQS + DynamoDB do ambiente) via token projetado.
    # O ARN vem do SSM /oficina/execucao/<ambiente>/irsa_role_arn (cd.yml).
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}
