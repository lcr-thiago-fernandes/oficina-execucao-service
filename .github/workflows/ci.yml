name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # ubuntu-latest tem Docker em execucao -> testes de integracao (Testcontainers) rodam aqui.
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OficinaExecucao.sln

      - name: Build
        run: dotnet build OficinaExecucao.sln --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test OficinaExecucao.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"HtmlInline;TextSummary;Cobertura"

      - name: Show coverage summary
        run: cat ./TestResults/CoverageReport/Summary.txt

      - name: Enforce minimum coverage (80%)
        run: |
          line_rate=$(grep -oP 'Line coverage:\s*\K[0-9.]+' ./TestResults/CoverageReport/Summary.txt | head -1)
          echo "Coverage: $line_rate%"
          awk -v cov="$line_rate" 'BEGIN { if (cov+0 < 80) { print "FAIL: coverage below 80%"; exit 1 } else print "OK: coverage >= 80%" }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport
          if-no-files-found: error

      - name: List vulnerable packages
        run: dotnet list OficinaExecucao.sln package --vulnerable --include-transitive || true

  format:
    # ADVISORY / NAO-BLOQUEANTE (continue-on-error).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OficinaExecucao.sln

      - name: dotnet format (verificacao - advisory)
        continue-on-error: true
        run: dotnet format OficinaExecucao.sln --verify-no-changes --no-restore --verbosity diagnostic

  sonar:
    # Nao obrigatorio: apenas avisa quando SONAR_TOKEN esta ausente (forks / conta nao configurada).
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'lcr-thiago-fernandes' }}
    steps:
      - name: Aviso sem SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN ausente - analise SonarCloud pulada (fork ou conta ainda nao configurada)."

      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        if: env.SONAR_TOKEN != ''
        with:
          global-json-file: global.json

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner --version 12.1.0

      - name: Sonar begin
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin \
            /k:"lcr-thiago-fernandes_oficina-execucao-service" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.exclusions="terraform/**,k8s/**,docker/**"

      - name: Build
        if: env.SONAR_TOKEN != ''
        run: dotnet build OficinaExecucao.sln -c Release

      - name: Test
        if: env.SONAR_TOKEN != ''
        run: dotnet test OficinaExecucao.sln --no-build -c Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Sonar end
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t oficina-execucao:ci .

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
